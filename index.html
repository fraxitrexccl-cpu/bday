<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Birthday Block Puzzle!</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #1e3a8a;
      overflow: hidden;
      touch-action: none;
    }

    h1 {
      margin-bottom: 6px;
      font-size: 2rem;
      color: #0284c7;
      text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.8);
    }

    .progress-bar {
      margin-bottom: 14px;
      font-size: 0.95rem;
      font-weight: 700;
      color: #0369a1;
      background: rgba(255, 255, 255, 0.8);
      padding: 5px 18px;
      border-radius: 20px;
      border: 1.5px solid #7dd3fc;
    }

    #board-wrapper {
      position: relative;
      background: #0f172a;
      padding: 14px;
      border-radius: 20px;
      box-shadow: 0 14px 32px rgba(2, 132, 199, 0.3);
      border: 5px solid #ffffff;
    }

    #grid {
      display: grid;
      grid-template-columns: repeat(5, 52px);
      grid-template-rows: repeat(5, 52px);
      gap: 5px;
    }

    .cell {
      width: 52px;
      height: 52px;
      background: #1e293b;
      border-radius: 8px;
      transition: transform 0.25s ease, opacity 0.3s ease, background 0.15s;
    }

    /* Glossy blue shades */
    .block-style-1 {
      background: linear-gradient(145deg, #38bdf8, #0284c7);
      box-shadow: inset 0 3px 4px rgba(255, 255, 255, 0.55), inset 0 -3px 4px rgba(0, 0, 0, 0.25);
    }
    .block-style-2 {
      background: linear-gradient(145deg, #60a5fa, #2563eb);
      box-shadow: inset 0 3px 4px rgba(255, 255, 255, 0.55), inset 0 -3px 4px rgba(0, 0, 0, 0.25);
    }
    .block-style-3 {
      background: linear-gradient(145deg, #22d3ee, #0891b2);
      box-shadow: inset 0 3px 4px rgba(255, 255, 255, 0.55), inset 0 -3px 4px rgba(0, 0, 0, 0.25);
    }
    .block-style-4 {
      background: linear-gradient(145deg, #818cf8, #4f46e5);
      box-shadow: inset 0 3px 4px rgba(255, 255, 255, 0.55), inset 0 -3px 4px rgba(0, 0, 0, 0.25);
    }
    .block-style-5 {
      background: linear-gradient(145deg, #7dd3fc, #0369a1);
      box-shadow: inset 0 3px 4px rgba(255, 255, 255, 0.55), inset 0 -3px 4px rgba(0, 0, 0, 0.25);
    }

    .cell.preview {
      background: rgba(125, 211, 252, 0.45) !important;
      border: 2px dashed #7dd3fc;
      box-shadow: none;
    }

    .cell.hint-glow {
      background: rgba(56, 189, 248, 0.25) !important;
      border: 2px dotted #38bdf8;
      animation: pulse 1s infinite alternate;
    }

    @keyframes pulse {
      from { opacity: 0.5; }
      to { opacity: 1; }
    }

    .cell.clearing {
      transform: scale(0) rotate(25deg);
      opacity: 0;
      background: #fde047 !important;
    }

    /* Tray with custom shapes */
    #tray {
      margin-top: 20px;
      background: rgba(255, 255, 255, 0.88);
      padding: 14px 20px;
      border-radius: 18px;
      border: 3px solid #7dd3fc;
      display: flex;
      align-items: center;
      justify-content: space-around;
      gap: 20px;
      min-height: 115px;
      min-width: 340px;
      box-shadow: 0 8px 20px rgba(2, 132, 199, 0.15);
    }

    .piece-slot {
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 85px;
      min-height: 85px;
    }

    .piece {
      display: grid;
      gap: 3px;
      cursor: grab;
      touch-action: none;
      transition: transform 0.15s ease;
    }

    .piece:hover {
      transform: scale(1.07);
    }

    .piece.dragging-source {
      opacity: 0.2;
    }

    .mini-cell {
      width: 24px;
      height: 24px;
      border-radius: 5px;
      pointer-events: none;
    }

    .mini-cell.empty {
      background: transparent;
    }

    /* Full-size floating clone when dragging */
    #drag-clone {
      position: fixed;
      display: none;
      gap: 5px;
      pointer-events: none;
      z-index: 50;
      filter: drop-shadow(0 12px 20px rgba(15, 23, 42, 0.45));
    }

    .clone-cell {
      width: 52px;
      height: 52px;
      border-radius: 8px;
    }

    .clone-cell.empty {
      background: transparent;
    }

    .controls-row {
      margin-top: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .hint-text {
      font-size: 0.92rem;
      color: #0369a1;
      font-weight: 600;
    }

    .small-btn {
      background: #ffffff;
      color: #0284c7;
      border: 1.5px solid #7dd3fc;
      padding: 5px 13px;
      font-size: 0.82rem;
      font-weight: 700;
      border-radius: 14px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .small-btn:hover {
      background: #e0f2fe;
    }

    /* Floating "Happy Birthday!" Text */
    #floating-hb {
      position: fixed;
      top: 42%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.4);
      font-size: 2.5rem;
      font-weight: 900;
      color: #ffffff;
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      padding: 14px 32px;
      border-radius: 40px;
      border: 4px solid #ffffff;
      box-shadow: 0 12px 30px rgba(2, 132, 199, 0.5);
      opacity: 0;
      pointer-events: none;
      z-index: 20;
      white-space: nowrap;
      transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    #floating-hb.show {
      opacity: 1;
      transform: translate(-50%, -85%) scale(1);
    }

    /* Fireworks Canvas */
    #fireworksCanvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 15;
    }

    /* Final Sweet Pop-Up Modal */
    #final-modal {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.55);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
      z-index: 30;
    }

    #final-modal.active {
      opacity: 1;
      pointer-events: auto;
    }

    .card {
      background: #ffffff;
      padding: 35px 30px;
      border-radius: 24px;
      max-width: 400px;
      width: 90%;
      text-align: center;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.3);
      border: 4px solid #7dd3fc;
      transform: translateY(25px);
      transition: transform 0.5s ease;
    }

    #final-modal.active .card {
      transform: translateY(0);
    }

    .card h2 {
      color: #0284c7;
      font-size: 1.8rem;
      margin-bottom: 12px;
    }

    .card p {
      font-size: 1.05rem;
      line-height: 1.6;
      color: #334155;
      margin-bottom: 24px;
    }

    button.main-btn {
      background: #0ea5e9;
      color: white;
      border: none;
      padding: 12px 28px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 25px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    button.main-btn:hover {
      background: #0284c7;
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  <h1>💙 Fill the Board! 💙</h1>
  <div class="progress-bar">Blocks Filled: <span id="filled-count">0</span> / 25</div>

  <div id="board-wrapper">
    <div id="grid"></div>
  </div>

  <div id="tray"></div>
  <div id="drag-clone"></div>

  <div class="controls-row">
    <span class="hint-text" id="hint-text">Drag the custom shapes onto the board!</span>
    <button class="small-btn" onclick="showHint()">💡 Hint</button>
    <button class="small-btn" onclick="initGame()">↻ Reset</button>
  </div>

  <!-- Floating Happy Birthday Text -->
  <div id="floating-hb">Happy Birthday! 🎉</div>

  <!-- Fireworks Layer -->
  <canvas id="fireworksCanvas"></canvas>

  <!-- Final Sweet Message Pop-Up -->
  <div id="final-modal">
    <div class="card">
      <div style="font-size: 3rem; margin-bottom: 10px;">💙🎂🎆</div>
      <h2>Happy Birthday!</h2>
      <p id="sweet-message"></p>
      <button class="main-btn" onclick="initGame()">Play Again</button>
    </div>
  </div>

  <script>
    // ==========================================
    // ✏️ CUSTOMIZE YOUR MESSAGES HERE
    // ==========================================
    const FLOATING_TEXT = "Happy Birthday! 🎉";
    const FINAL_SWEET_MESSAGE = 
      "Wishing you the sweetest birthday filled with endless laughter, love, and all your favorite things. Thank you for always being such an amazing person in my life. Here's to another wonderful year ahead! 💙";
    // ==========================================

    const gridEl = document.getElementById("grid");
    const trayEl = document.getElementById("tray");
    const dragClone = document.getElementById("drag-clone");
    const floatingHb = document.getElementById("floating-hb");
    const finalModal = document.getElementById("final-modal");
    const hintText = document.getElementById("hint-text");
    const filledCountEl = document.getElementById("filled-count");

    floatingHb.textContent = FLOATING_TEXT;
    document.getElementById("sweet-message").textContent = FINAL_SWEET_MESSAGE;

    const SIZE = 5;
    const CELL_SIZE = 52;
    const CELL_GAP = 5;

    // 5 Custom Non-Standard Shapes that tile the 5x5 board (5 + 6 + 5 + 6 + 3 = 25 squares!)
    // Each piece also stores its exact solution coordinate (solR, solC) for the Hint button
    const WAVES = [
      // Wave 1 (First 3 custom pieces)
      [
        {
          id: "u-cup",
          style: "block-style-1",
          solR: 0,
          solC: 0,
          matrix: [
            [1, 0, 1],
            [1, 1, 1]
          ]
        },
        {
          id: "tuck-hook",
          style: "block-style-2",
          solR: 0,
          solC: 1,
          matrix: [
            [0, 1, 1],
            [1, 0, 1],
            [0, 1, 1]
          ]
        },
        {
          id: "plus-cross",
          style: "block-style-3",
          solR: 2,
          solC: 0,
          matrix: [
            [0, 1, 0],
            [1, 1, 1],
            [0, 1, 0]
          ]
        }
      ],
      // Wave 2 (Final 2 custom pieces to complete all 25 squares)
      [
        {
          id: "zigzag-wing",
          style: "block-style-4",
          solR: 2,
          solC: 2,
          matrix: [
            [1, 0, 0],
            [1, 1, 1],
            [0, 1, 0]
          ]
        },
        {
          id: "corner-step",
          style: "block-style-5",
          solR: 3,
          solC: 3,
          matrix: [
            [0, 1],
            [1, 1]
          ]
        }
      ]
    ];

    let board = [];
    let currentWaveIndex = 0;
    let placedInWave = 0;
    let totalFilled = 0;
    let activeShape = null;
    let activePieceEl = null;
    let currentPreviewCells = [];
    let isFinished = false;

    function initGame() {
      board = Array.from({ length: SIZE }, () => Array(SIZE).fill(null));
      currentWaveIndex = 0;
      placedInWave = 0;
      totalFilled = 0;
      activeShape = null;
      isFinished = false;

      filledCountEl.textContent = "0";
      floatingHb.classList.remove("show");
      finalModal.classList.remove("active");
      hintText.textContent = "Drag the custom shapes onto the board!";
      stopFireworks();

      renderBoard();
      loadWave(0);
    }

    function renderBoard() {
      gridEl.innerHTML = "";
      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          const cell = document.createElement("div");
          cell.className = "cell";
          cell.dataset.row = r;
          cell.dataset.col = c;
          if (board[r][c]) {
            cell.classList.add(board[r][c]);
          }
          gridEl.appendChild(cell);
        }
      }
    }

    function loadWave(waveIdx) {
      trayEl.innerHTML = "";
      placedInWave = 0;
      const shapes = WAVES[waveIdx];
      if (!shapes) return;

      shapes.forEach((shape) => {
        const slot = document.createElement("div");
        slot.className = "piece-slot";

        const piece = document.createElement("div");
        piece.className = "piece";
        piece.dataset.shapeId = shape.id;
        piece.style.gridTemplateColumns = `repeat(${shape.matrix[0].length}, 24px)`;

        shape.matrix.forEach((row) => {
          row.forEach((val) => {
            const mc = document.createElement("div");
            mc.className = val ? `mini-cell ${shape.style}` : "mini-cell empty";
            piece.appendChild(mc);
          });
        });

        piece.addEventListener("pointerdown", (e) => startDrag(e, shape, piece));
        slot.appendChild(piece);
        trayEl.appendChild(slot);
      });
    }

    function showHint() {
      if (isFinished) return;
      document.querySelectorAll(".hint-glow").forEach(c => c.classList.remove("hint-glow"));

      const shapes = WAVES[currentWaveIndex];
      const nextShape = shapes.find(s => {
        const el = document.querySelector(`.piece[data-shape-id="${s.id}"]`);
        return el && el.dataset.used !== "true";
      });

      if (!nextShape) return;

      if (!canPlace(nextShape, nextShape.solR, nextShape.solC)) {
        hintText.textContent = "A piece is blocking the spot—hit Reset to try fresh!";
        return;
      }

      for (let r = 0; r < nextShape.matrix.length; r++) {
        for (let c = 0; c < nextShape.matrix[0].length; c++) {
          if (nextShape.matrix[r][c] === 1) {
            const cell = document.querySelector(
              `.cell[data-row="${nextShape.solR + r}"][data-col="${nextShape.solC + c}"]`
            );
            if (cell) cell.classList.add("hint-glow");
          }
        }
      }
    }

    function startDrag(e, shape, pieceEl) {
      if (isFinished || pieceEl.dataset.used === "true") return;
      e.preventDefault();

      document.querySelectorAll(".hint-glow").forEach(c => c.classList.remove("hint-glow"));

      activeShape = shape;
      activePieceEl = pieceEl;
      pieceEl.classList.add("dragging-source");

      dragClone.innerHTML = "";
      dragClone.style.display = "grid";
      dragClone.style.gridTemplateColumns = `repeat(${shape.matrix[0].length}, ${CELL_SIZE}px)`;

      shape.matrix.forEach((row) => {
        row.forEach((val) => {
          const cc = document.createElement("div");
          cc.className = val ? `clone-cell ${shape.style}` : "clone-cell empty";
          dragClone.appendChild(cc);
        });
      });

      updateDragPosition(e.clientX, e.clientY);
      window.addEventListener("pointermove", onPointerMove);
      window.addEventListener("pointerup", onPointerUp);
    }

    function updateDragPosition(clientX, clientY) {
      if (!activeShape) return;
      const rows = activeShape.matrix.length;
      const cols = activeShape.matrix[0].length;
      const cloneW = cols * CELL_SIZE + (cols - 1) * CELL_GAP;
      const cloneH = rows * CELL_SIZE + (rows - 1) * CELL_GAP;

      const topLeftX = clientX - cloneW / 2;
      const topLeftY = clientY - cloneH / 2 - 30;

      dragClone.style.left = `${topLeftX}px`;
      dragClone.style.top = `${topLeftY}px`;

      updateBoardPreview(topLeftX, topLeftY);
    }

    function getTargetGridPos(topLeftX, topLeftY) {
      const gridRect = gridEl.getBoundingClientRect();
      const step = CELL_SIZE + CELL_GAP;
      const col = Math.round((topLeftX - gridRect.left) / step);
      const row = Math.round((topLeftY - gridRect.top) / step);
      return { row, col };
    }

    function canPlace(shape, startR, startC) {
      for (let r = 0; r < shape.matrix.length; r++) {
        for (let c = 0; c < shape.matrix[0].length; c++) {
          if (shape.matrix[r][c] === 1) {
            const br = startR + r;
            const bc = startC + c;
            if (br < 0 || br >= SIZE || bc < 0 || bc >= SIZE) return false;
            if (board[br][bc] !== null) return false;
          }
        }
      }
      return true;
    }

    function clearPreview() {
      currentPreviewCells.forEach(cell => cell.classList.remove("preview"));
      currentPreviewCells = [];
    }

    function updateBoardPreview(topLeftX, topLeftY) {
      clearPreview();
      if (!activeShape) return;

      const { row, col } = getTargetGridPos(topLeftX, topLeftY);
      if (canPlace(activeShape, row, col)) {
        for (let r = 0; r < activeShape.matrix.length; r++) {
          for (let c = 0; c < activeShape.matrix[0].length; c++) {
            if (activeShape.matrix[r][c] === 1) {
              const cell = document.querySelector(`.cell[data-row="${row + r}"][data-col="${col + c}"]`);
              if (cell) {
                cell.classList.add("preview");
                currentPreviewCells.push(cell);
              }
            }
          }
        }
      }
    }

    function onPointerMove(e) {
      updateDragPosition(e.clientX, e.clientY);
    }

    function onPointerUp(e) {
      window.removeEventListener("pointermove", onPointerMove);
      window.removeEventListener("pointerup", onPointerUp);

      if (!activeShape) return;

      const rows = activeShape.matrix.length;
      const cols = activeShape.matrix[0].length;
      const cloneW = cols * CELL_SIZE + (cols - 1) * CELL_GAP;
      const cloneH = rows * CELL_SIZE + (rows - 1) * CELL_GAP;
      const topLeftX = e.clientX - cloneW / 2;
      const topLeftY = e.clientY - cloneH / 2 - 30;

      const { row, col } = getTargetGridPos(topLeftX, topLeftY);
      clearPreview();
      dragClone.style.display = "none";

      if (canPlace(activeShape, row, col)) {
        let added = 0;
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            if (activeShape.matrix[r][c] === 1) {
              board[row + r][col + c] = activeShape.style;
              added++;
            }
          }
        }

        totalFilled += added;
        filledCountEl.textContent = totalFilled;

        activePieceEl.style.visibility = "hidden";
        activePieceEl.dataset.used = "true";
        placedInWave++;
        renderBoard();

        if (totalFilled >= 25) {
          triggerAllClearCelebration();
        } else if (placedInWave === WAVES[currentWaveIndex].length) {
          currentWaveIndex++;
          setTimeout(() => loadWave(currentWaveIndex), 200);
        }
      } else {
        activePieceEl.classList.remove("dragging-source");
      }

      activeShape = null;
      activePieceEl = null;
    }

    function triggerAllClearCelebration() {
      isFinished = true;
      hintText.textContent = "ALL CLEAR!! ✨";

      setTimeout(() => {
        document.querySelectorAll(".cell").forEach((cell, idx) => {
          setTimeout(() => {
            cell.classList.add("clearing");
            cell.classList.remove(
              "block-style-1",
              "block-style-2",
              "block-style-3",
              "block-style-4",
              "block-style-5"
            );
          }, Math.floor(idx / SIZE) * 45);
        });
      }, 250);

      setTimeout(() => {
        floatingHb.classList.add("show");
      }, 650);

      setTimeout(() => {
        startFireworks();
      }, 1350);

      setTimeout(() => {
        floatingHb.classList.remove("show");
        finalModal.classList.add("active");
      }, 3400);
    }

    // ==========================================
    // 🎆 FIREWORKS ANIMATION ENGINE
    // ==========================================
    const fwCanvas = document.getElementById("fireworksCanvas");
    const fwCtx = fwCanvas.getContext("2d");
    let particles = [];
    let fireworksActive = false;
    let fwInterval;

    function resizeCanvas() {
      fwCanvas.width = window.innerWidth;
      fwCanvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    function createBurst(x, y) {
      const colors = ["#38bdf8", "#fde047", "#ffffff", "#60a5fa", "#f472b6", "#34d399"];
      const color = colors[Math.floor(Math.random() * colors.length)];
      for (let i = 0; i < 55; i++) {
        const angle = (Math.PI * 2 * i) / 55;
        const speed = Math.random() * 5 + 2;
        particles.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          alpha: 1,
          color
        });
      }
    }

    function animateFireworks() {
      if (!fireworksActive && particles.length === 0) return;
      fwCtx.clearRect(0, 0, fwCanvas.width, fwCanvas.height);

      particles.forEach((p, index) => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.06;
        p.alpha -= 0.016;

        if (p.alpha <= 0) {
          particles.splice(index, 1);
        } else {
          fwCtx.save();
          fwCtx.globalAlpha = p.alpha;
          fwCtx.fillStyle = p.color;
          fwCtx.beginPath();
          fwCtx.arc(p.x, p.y, 3.2, 0, Math.PI * 2);
          fwCtx.fill();
          fwCtx.restore();
        }
      });

      requestAnimationFrame(animateFireworks);
    }

    function startFireworks() {
      fireworksActive = true;
      createBurst(fwCanvas.width * 0.3, fwCanvas.height * 0.35);
      createBurst(fwCanvas.width * 0.7, fwCanvas.height * 0.35);
      animateFireworks();

      fwInterval = setInterval(() => {
        if (!fireworksActive) return;
        const rx = Math.random() * (fwCanvas.width * 0.7) + fwCanvas.width * 0.15;
        const ry = Math.random() * (fwCanvas.height * 0.45) + fwCanvas.height * 0.12;
        createBurst(rx, ry);
      }, 650);
    }

    function stopFireworks() {
      fireworksActive = false;
      clearInterval(fwInterval);
      particles = [];
      fwCtx.clearRect(0, 0, fwCanvas.width, fwCanvas.height);
    }

    initGame();
  </script>
</body>
</html>
