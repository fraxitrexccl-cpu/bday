<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Birthday Block Blast!</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
    }

    body {
      background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #1e3a8a;
      overflow: hidden;
    }

    h1 {
      margin-bottom: 12px;
      font-size: 2rem;
      color: #0284c7;
      text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.8);
    }

    #board-wrapper {
      position: relative;
      background: #0f172a;
      padding: 12px;
      border-radius: 18px;
      box-shadow: 0 14px 32px rgba(2, 132, 199, 0.3);
      border: 5px solid #ffffff;
    }

    #grid {
      display: grid;
      grid-template-columns: repeat(8, 38px);
      grid-template-rows: repeat(8, 38px);
      gap: 4px;
    }

    .cell {
      width: 38px;
      height: 38px;
      background: #1e293b;
      border-radius: 6px;
      transition: transform 0.25s ease, opacity 0.3s ease, background 0.2s;
    }

    .cell.filled {
      background: linear-gradient(145deg, #38bdf8, #0284c7);
      box-shadow: inset 0 2px 3px rgba(255, 255, 255, 0.45), 0 2px 4px rgba(0, 0, 0, 0.3);
    }

    .cell.highlight {
      background: #7dd3fc !important;
      box-shadow: 0 0 12px #38bdf8;
    }

    .cell.clearing {
      transform: scale(0) rotate(25deg);
      opacity: 0;
      background: #fde047 !important;
    }

    /* Draggable Piece Dock */
    #dock {
      margin-top: 22px;
      background: rgba(255, 255, 255, 0.7);
      padding: 14px 22px;
      border-radius: 16px;
      border: 2px solid #7dd3fc;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 76px;
      justify-content: center;
    }

    #piece {
      display: flex;
      gap: 4px;
      cursor: grab;
      transition: transform 0.15s ease;
    }

    #piece:hover {
      transform: scale(1.04);
    }

    #piece:active {
      cursor: grabbing;
    }

    .piece-block {
      width: 34px;
      height: 34px;
      border-radius: 6px;
      background: linear-gradient(145deg, #0ea5e9, #0369a1);
      box-shadow: inset 0 2px 3px rgba(255, 255, 255, 0.5), 0 4px 8px rgba(2, 132, 199, 0.35);
    }

    .hint {
      margin-top: 10px;
      font-size: 0.9rem;
      color: #0369a1;
      font-weight: 500;
    }

    /* Floating "Happy Birthday!" Text */
    #floating-hb {
      position: fixed;
      top: 42%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.4);
      font-size: 2.6rem;
      font-weight: 900;
      color: #ffffff;
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      padding: 14px 32px;
      border-radius: 40px;
      border: 4px solid #ffffff;
      box-shadow: 0 12px 30px rgba(2, 132, 199, 0.5);
      opacity: 0;
      pointer-events: none;
      z-index: 20;
      white-space: nowrap;
      transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    #floating-hb.show {
      opacity: 1;
      transform: translate(-50%, -85%) scale(1);
    }

    /* Fireworks Canvas */
    #fireworksCanvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 15;
    }

    /* Final Sweet Pop-Up Modal */
    #final-modal {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.55);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
      z-index: 30;
    }

    #final-modal.active {
      opacity: 1;
      pointer-events: auto;
    }

    .card {
      background: #ffffff;
      padding: 35px 30px;
      border-radius: 24px;
      max-width: 400px;
      width: 90%;
      text-align: center;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.3);
      border: 4px solid #7dd3fc;
      transform: translateY(25px);
      transition: transform 0.5s ease;
    }

    #final-modal.active .card {
      transform: translateY(0);
    }

    .card h2 {
      color: #0284c7;
      font-size: 1.8rem;
      margin-bottom: 12px;
    }

    .card p {
      font-size: 1.05rem;
      line-height: 1.6;
      color: #334155;
      margin-bottom: 24px;
    }

    button {
      background: #0ea5e9;
      color: white;
      border: none;
      padding: 12px 28px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 25px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    button:hover {
      background: #0284c7;
      transform: scale(1.05);
    }
  </style>
</head>
