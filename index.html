<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Birthday Block Blast!</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #1e3a8a;
      overflow: hidden;
      touch-action: none;
    }

    h1 {
      margin-bottom: 12px;
      font-size: 2rem;
      color: #0284c7;
      text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.8);
    }

    #board-wrapper {
      position: relative;
      background: #0f172a;
      padding: 12px;
      border-radius: 18px;
      box-shadow: 0 14px 32px rgba(2, 132, 199, 0.3);
      border: 5px solid #ffffff;
    }

    #grid {
      display: grid;
      grid-template-columns: repeat(8, 38px);
      grid-template-rows: repeat(8, 38px);
      gap: 4px;
    }

    .cell {
      width: 38px;
      height: 38px;
      background: #1e293b;
      border-radius: 6px;
      transition: transform 0.25s ease, opacity 0.3s ease, background 0.15s;
    }

    .cell.filled {
      background: linear-gradient(145deg, #38bdf8, #0284c7);
      box-shadow: inset 0 2px 3px rgba(255, 255, 255, 0.45), 0 2px 4px rgba(0, 0, 0, 0.3);
    }

    .cell.highlight {
      background: #7dd3fc !important;
      box-shadow: 0 0 14px #38bdf8;
    }

    .cell.clearing {
      transform: scale(0) rotate(25deg);
      opacity: 0;
      background: #fde047 !important;
    }

    /* Draggable Piece Dock */
    #dock {
      margin-top: 22px;
      background: rgba(255, 255, 255, 0.75);
      padding: 14px 22px;
      border-radius: 16px;
      border: 2px solid #7dd3fc;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 76px;
      min-width: 360px;
    }

    #piece {
      display: flex;
      gap: 4px;
      cursor: grab;
      z-index: 12;
      transition: transform 0.15s ease;
    }

    #piece.dragging {
      position: fixed;
      cursor: grabbing;
      transform: scale(1.08);
      pointer-events: none;
    }

    .piece-block {
      width: 36px;
      height: 36px;
      border-radius: 6px;
      background: linear-gradient(145deg, #0ea5e9, #0369a1);
      box-shadow: inset 0 2px 3px rgba(255, 255, 255, 0.5), 0 4px 8px rgba(2, 132, 199, 0.35);
    }

    .hint {
      margin-top: 10px;
      font-size: 0.95rem;
      color: #0369a1;
      font-weight: 600;
    }

    /* Floating "Happy Birthday!" Text */
    #floating-hb {
      position: fixed;
      top: 42%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.4);
      font-size: 2.6rem;
      font-weight: 900;
      color: #ffffff;
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      padding: 14px 32px;
      border-radius: 40px;
      border: 4px solid #ffffff;
      box-shadow: 0 12px 30px rgba(2, 132, 199, 0.5);
      opacity: 0;
      pointer-events: none;
      z-index: 20;
      white-space: nowrap;
      transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    #floating-hb.show {
      opacity: 1;
      transform: translate(-50%, -85%) scale(1);
    }

    /* Fireworks Canvas */
    #fireworksCanvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 15;
    }

    /* Final Sweet Pop-Up Modal */
    #final-modal {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.55);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
      z-index: 30;
    }

    #final-modal.active {
      opacity: 1;
      pointer-events: auto;
    }

    .card {
      background: #ffffff;
      padding: 35px 30px;
      border-radius: 24px;
      max-width: 400px;
      width: 90%;
      text-align: center;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.3);
      border: 4px solid #7dd3fc;
      transform: translateY(25px);
      transition: transform 0.5s ease;
    }

    #final-modal.active .card {
      transform: translateY(0);
    }

    .card h2 {
      color: #0284c7;
      font-size: 1.8rem;
      margin-bottom: 12px;
    }

    .card p {
      font-size: 1.05rem;
      line-height: 1.6;
      color: #334155;
      margin-bottom: 24px;
    }

    button {
      background: #0ea5e9;
      color: white;
      border: none;
      padding: 12px 28px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 25px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    button:hover {
      background: #0284c7;
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  <h1>💙 Clear the Blocks! 💙</h1>

  <div id="board-wrapper">
    <div id="grid"></div>
  </div>

  <div id="dock">
    <div id="piece">
      <div class="piece-block"></div>
      <div class="piece-block"></div>
      <div class="piece-block"></div>
      <div class="piece-block"></div>
      <div class="piece-block"></div>
      <div class="piece-block"></div>
      <div class="piece-block"></div>
      <div class="piece-block"></div>
    </div>
  </div>

  <p class="hint" id="hint-text">Drag (or tap) the block into the empty row!</p>

  <!-- Floating Happy Birthday Text -->
  <div id="floating-hb">Happy Birthday! 🎉</div>

  <!-- Fireworks Layer -->
  <canvas id="fireworksCanvas"></canvas>

  <!-- Final Sweet Message Pop-Up -->
  <div id="final-modal">
    <div class="card">
      <div style="font-size: 3rem; margin-bottom: 10px;">💙🎂🎆</div>
      <h2>Happy Birthday!</h2>
      <p id="sweet-message"></p>
      <button onclick="resetGame()">Play Again</button>
    </div>
  </div>

  <script>
    // ==========================================
    // ✏️ CUSTOMIZE YOUR MESSAGES HERE
    // ==========================================
    const FLOATING_TEXT = "Happy Birthday! 🎉";
    const FINAL_SWEET_MESSAGE = 
      "Wishing you the sweetest birthday filled with endless laughter, love, and all your favorite things. Thank you for always being such an amazing person in my life. Here's to another wonderful year ahead! 💙";
    // ==========================================

    const gridEl = document.getElementById("grid");
    const boardWrapper = document.getElementById("board-wrapper");
    const pieceEl = document.getElementById("piece");
    const floatingHb = document.getElementById("floating-hb");
    const finalModal = document.getElementById("final-modal");
    const hintText = document.getElementById("hint-text");

    floatingHb.textContent = FLOATING_TEXT;
    document.getElementById("sweet-message").textContent = FINAL_SWEET_MESSAGE;

    const ROWS = 8;
    const COLS = 8;
    const TARGET_ROW = 4; // The single empty row she needs to fill
    let isCleared = false;
    let isDragging = false;
    let dragMoved = false;

    function buildBoard() {
      gridEl.innerHTML = "";
      isCleared = false;
      isDragging = false;
      pieceEl.classList.remove("dragging");
      pieceEl.style.left = "";
      pieceEl.style.top = "";
      pieceEl.style.visibility = "visible";

      hintText.textContent = "Drag (or tap) the block into the empty row!";
      floatingHb.classList.remove("show");
      finalModal.classList.remove("active");
      stopFireworks();

      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const cell = document.createElement("div");
          cell.classList.add("cell");
          cell.dataset.row = r;
          cell.dataset.col = c;

          if (r !== TARGET_ROW) {
            cell.classList.add("filled");
          } else {
            cell.addEventListener("click", () => completeMove());
          }

          gridEl.appendChild(cell);
        }
      }
    }

    function highlightTargetRow(active) {
      if (isCleared) return;
      document.querySelectorAll(`.cell[data-row="${TARGET_ROW}"]`).forEach((cell) => {
        cell.classList.toggle("highlight", active);
      });
    }

    function isOverBoard(clientX, clientY) {
      const rect = boardWrapper.getBoundingClientRect();
      return (
        clientX >= rect.left - 30 &&
        clientX <= rect.right + 30 &&
        clientY >= rect.top - 30 &&
        clientY <= rect.bottom + 30
      );
    }

    // Smooth Pointer Dragging (Works on Mouse + Touchscreens)
    pieceEl.addEventListener("pointerdown", (e) => {
      if (isCleared) return;
      isDragging = true;
      dragMoved = false;
      pieceEl.classList.add("dragging");
      movePieceTo(e.clientX, e.clientY);
    });

    window.addEventListener("pointermove", (e) => {
      if (!isDragging || isCleared) return;
      dragMoved = true;
      movePieceTo(e.clientX, e.clientY);
      highlightTargetRow(isOverBoard(e.clientX, e.clientY));
    });

    window.addEventListener("pointerup", (e) => {
      if (!isDragging) return;
      isDragging = false;
      pieceEl.classList.remove("dragging");
      pieceEl.style.left = "";
      pieceEl.style.top = "";
      highlightTargetRow(false);

      // Snap into place if dropped anywhere over the board OR if simply tapped/clicked!
      if (!dragMoved || isOverBoard(e.clientX, e.clientY)) {
        completeMove();
      }
    });

    function movePieceTo(clientX, clientY) {
      const rect = pieceEl.getBoundingClientRect();
      pieceEl.style.left = `${clientX - rect.width / 2}px`;
      pieceEl.style.top = `${clientY - rect.height / 2}px`;
    }

    function completeMove() {
      if (isCleared) return;
      isCleared = true;

      // 1. Place the piece into the empty row
      pieceEl.style.visibility = "hidden";
      hintText.textContent = "Amazing!! ✨";
      document.querySelectorAll(`.cell[data-row="${TARGET_ROW}"]`).forEach((cell) => {
        cell.classList.remove("highlight");
        cell.classList.add("filled");
      });

      // 2. Clear ALL blocks on the board after a brief beat
      setTimeout(() => {
        document.querySelectorAll(".cell").forEach((cell, idx) => {
          setTimeout(() => {
            cell.classList.add("clearing");
            cell.classList.remove("filled");
          }, Math.floor(idx / 8) * 35);
        });
      }, 250);

      // 3. Show Floating "Happy Birthday!" text first
      setTimeout(() => {
        floatingHb.classList.add("show");
      }, 650);

      // 4. Launch Fireworks right after
      setTimeout(() => {
        startFireworks();
      }, 1300);

      // 5. Show the Final Sweet Pop-Up Card
      setTimeout(() => {
        floatingHb.classList.remove("show");
        finalModal.classList.add("active");
      }, 3400);
    }

    // ==========================================
    // 🎆 FIREWORKS ANIMATION ENGINE
    // ==========================================
    const fwCanvas = document.getElementById("fireworksCanvas");
    const fwCtx = fwCanvas.getContext("2d");
    let particles = [];
    let fireworksActive = false;
    let fwInterval;

    function resizeCanvas() {
      fwCanvas.width = window.innerWidth;
      fwCanvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    function createBurst(x, y) {
      const colors = ["#38bdf8", "#fde047", "#ffffff", "#60a5fa", "#f472b6", "#34d399"];
      const color = colors[Math.floor(Math.random() * colors.length)];
      for (let i = 0; i < 55; i++) {
        const angle = (Math.PI * 2 * i) / 55;
        const speed = Math.random() * 5 + 2;
        particles.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          alpha: 1,
          color
        });
      }
    }

    function animateFireworks() {
      if (!fireworksActive && particles.length === 0) return;
      fwCtx.clearRect(0, 0, fwCanvas.width, fwCanvas.height);

      particles.forEach((p, index) => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.06;
        p.alpha -= 0.016;

        if (p.alpha <= 0) {
          particles.splice(index, 1);
        } else {
          fwCtx.save();
          fwCtx.globalAlpha = p.alpha;
          fwCtx.fillStyle = p.color;
          fwCtx.beginPath();
          fwCtx.arc(p.x, p.y, 3.2, 0, Math.PI * 2);
          fwCtx.fill();
          fwCtx.restore();
        }
